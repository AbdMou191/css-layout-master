<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>نتيجتي في اختبار CSS</title>
  
  <!-- Open Graph - فيسبوك سيقرأ هذه البيانات -->
  <meta property="og:title" content="🎯 تحدي CSS Flexbox & Grid">
  <meta property="og:description" content="هل تستطيع التفوق على نتيجتي؟ اختبر نفسك الآن!">
  <meta property="og:image" content="https://abdmou191.github.io/css-layout-master/share-preview.jpg">
  <meta property="og:url" content="https://abdmou191.github.io/css-layout-master/share.html">
  <meta property="og:type" content="website">
  
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .share-container {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      text-align: center;
    }
    
    .share-container h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: var(--txt);
    }
    
    #resultCanvas {
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      max-width: 100%;
      margin: 20px auto;
      display: block;
    }
    
    .share-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }
    
    .share-btn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      color: white;
    }
    
    .share-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }
    
    .btn-save {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .btn-share-native {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    }
    
    .btn-facebook {
      background: linear-gradient(135deg, #1877f2 0%, #0d5bc6 100%);
    }
    
    .btn-twitter {
      background: linear-gradient(135deg, #000000 0%, #333333 100%);
    }
    
    .btn-whatsapp {
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
    }
    
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    .score-display {
      font-size: 48px;
      font-weight: 700;
      margin: 20px 0;
      color: var(--accent);
    }
    
    .message {
      font-size: 18px;
      color: var(--txt);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="share-container">
    <h1>🎯 نتيجتي في اختبار CSS</h1>
    
    <div class="score-display" id="scoreDisplay">--/--</div>
    <div class="message" id="messageDisplay">جاري التحميل...</div>
    
    <canvas id="resultCanvas" width="1080" height="1080"></canvas>
    
    <div class="share-actions">
      <button class="share-btn btn-save" id="saveBtn">
        💾 حفظ الصورة
      </button>
      
      <button class="share-btn btn-share-native" id="nativeShareBtn">
        📤 مشاركة الصورة
      </button>
      
      <button class="share-btn btn-whatsapp" id="whatsappBtn">
        💬 واتساب
      </button>
      
      <button class="share-btn btn-twitter" id="twitterBtn">
        🐦 تويتر / X
      </button>
      
      <button class="share-btn btn-facebook" id="facebookBtn">
        📘 فيسبوك
      </button>
    </div>
    
    <a href="index.html" class="back-link">← العودة للتطبيق</a>
  </div>

  <script>
    // قراءة النقاط من URL
    var params = new URLSearchParams(window.location.search);
    var score = parseInt(params.get('score')) || 0;
    var total = parseInt(params.get('total')) || 10;
    var percentage = Math.round((score / total) * 100);
    
    // تحديد الرسالة حسب النسبة
    var message = '';
    var emoji = '';
    var color = '';
    
    if (percentage >= 90) {
      message = 'أداء استثنائي! أنت محترف CSS 🏆';
      emoji = '🏆';
      color = '#FFD700';
    } else if (percentage >= 75) {
      message = 'ممتاز! أتقنت الأساسيات 🌟';
      emoji = '🌟';
      color = '#22c55e';
    } else if (percentage >= 50) {
      message = 'جيد! استمر في التعلم 📚';
      emoji = '📚';
      color = '#3b82f6';
    } else {
      message = 'لا بأس، الممارسة تصنع الإتقان 💪';
      emoji = '💪';
      color = '#f59e0b';
    }
    
    // عرض النتيجة
    document.getElementById('scoreDisplay').textContent = score + '/' + total;
    document.getElementById('messageDisplay').textContent = message;
    
    // رسم الصورة على Canvas
    var canvas = document.getElementById('resultCanvas');
    var ctx = canvas.getContext('2d');
    var W = canvas.width;
    var H = canvas.height;
    
    // خلفية متدرجة
    var gradient = ctx.createLinearGradient(0, 0, W, H);
    gradient.addColorStop(0, '#1a1a2e');
    gradient.addColorStop(0.5, '#16213e');
    gradient.addColorStop(1, '#0f3460');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
    
    // دوائر زخرفية
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.beginPath();
    ctx.arc(W * 0.8, H * 0.2, 200, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W * 0.2, H * 0.8, 150, 0, Math.PI * 2);
    ctx.fill();
    
    // الإطار الذهبي
    ctx.strokeStyle = color;
    ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    
    // الإيموجي الكبير
    ctx.font = '200px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, W / 2, H * 0.25);
    
    // عنوان
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 70px Arial';
    ctx.fillText('مرجع Flexbox & Grid', W / 2, H * 0.42);
    
    // النتيجة
    ctx.fillStyle = color;
    ctx.font = 'bold 180px Arial';
    ctx.fillText(score + '/' + total, W / 2, H * 0.62);
    
    // النسبة المئوية
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 60px Arial';
    ctx.fillText(percentage + '%', W / 2, H * 0.72);
    
    // الرسالة
    ctx.font = '50px Arial';
    ctx.fillStyle = '#e0e0e0';
    
    // تقسيم النص الطويل
    var words = message.split(' ');
    var lines = [];
    var currentLine = '';
    for (var i = 0; i < words.length; i++) {
      var testLine = currentLine + words[i] + ' ';
      if (ctx.measureText(testLine).width > W - 100 && currentLine !== '') {
        lines.push(currentLine);
        currentLine = words[i] + ' ';
      } else {
        currentLine = testLine;
      }
    }
    lines.push(currentLine);
    
    var lineHeight = 70;
    var startY = H * 0.82;
    for (var j = 0; j < lines.length; j++) {
      ctx.fillText(lines[j].trim(), W / 2, startY + (j * lineHeight));
    }
    
    // الشعار في الأسفل
    ctx.fillStyle = '#888888';
    ctx.font = '35px Arial';
    ctx.fillText('abdmou191.github.io/css-layout-master', W / 2, H - 80);
    
    // ====== أزرار المشاركة ======
    
    // حفظ الصورة
    document.getElementById('saveBtn').addEventListener('click', function() {
      canvas.toBlob(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'css-quiz-result-' + score + '-' + total + '.png';
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    });
    
    // مشاركة أصلية (Web Share API مع ملف)
    document.getElementById('nativeShareBtn').addEventListener('click', async function() {
      if (!navigator.share) {
        alert('مشاركة الملفات غير مدعومة في هذا المتصفح');
        return;
      }
      
      canvas.toBlob(async function(blob) {
        var file = new File([blob], 'css-result.png', { type: 'image/png' });
        try {
          await navigator.share({
            files: [file],
            title: 'نتيجتي في اختبار CSS',
            text: message + ' (' + score + '/' + total + ')',
            url: 'https://abdmou191.github.io/css-layout-master/'
          });
        } catch (err) {
          console.log('مشاركة ملغاة:', err);
        }
      }, 'image/png');
    });
    
    // واتساب
    document.getElementById('whatsappBtn').addEventListener('click', function() {
      var text = encodeURIComponent(message + ' (' + score + '/' + total + ') 🎯\n\nجرّب الاختبار هنا:\nhttps://abdmou191.github.io/css-layout-master/');
      window.open('https://wa.me/?text=' + text, '_blank');
    });
    
    // تويتر
    document.getElementById('twitterBtn').addEventListener('click', function() {
      var text = encodeURIComponent(message + ' (' + score + '/' + total + ') 🎯\n\nجرّب الاختبار هنا:');
      var url = encodeURIComponent('https://abdmou191.github.io/css-layout-master/');
      window.open('https://twitter.com/intent/tweet?text=' + text + '&url=' + url, '_blank');
    });
    
    // فيسبوك
    document.getElementById('facebookBtn').addEventListener('click', function() {
      var url = encodeURIComponent('https://abdmou191.github.io/css-layout-master/');
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + url, '_blank');
    });
  </script>
</body>
</html>
